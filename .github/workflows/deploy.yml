name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest films from Letterboxd
        # Writes films.json from the RSS feed. Self-guards (exits 0 on failure),
        # so a fetch error never blocks the deploy — the page keeps its fallback.
        run: node scripts/fetch-films.js

      - name: Fetch The Shelf from Goodreads
        # Writes books.json from the Goodreads RSS shelves. Self-guards too.
        run: node scripts/fetch-books.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site at the repo root; films.json is generated above.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
